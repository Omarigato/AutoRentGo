name: CI / Automated Tests & Code Quality

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: Backend Tests & Linting (Python 3.11)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r back/requirements-dev.txt

      - name: Lint with flake8 (syntax errors & critical issues)
        run: |
          # Stop the build if there are Python syntax errors or undefined names
          flake8 back/app back/tests --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Run Pytest test suite
        run: |
          pytest -v --color=yes

  docker-compose-validation:
    name: Validate Docker Compose Configuration
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Copy .env.example to .env
        run: cp .env.example .env

      - name: Validate Docker Compose
        run: docker compose config
